services:
  home-calendar:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:8080"
    volumes:
      - ./data:/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      TZ: ${TZ:-}
    restart: unless-stopped
